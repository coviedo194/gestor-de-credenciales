App:
  Properties:
    Formulas: |-
      =nfStudioMode = StartsWith(
          Host.Version,
          "PowerApps-Studio"
      );
      nfColorGrayClaro = RGBA(
          245,
          245,
          245,
          1
      );
      nfColorBorder_Clasicc = ColorFade(
          nfColorGrayClaro,
          -30%
      );
      nfColorFont_Clasicc = RGBA(
          48,
          48,
          48,
          100
      );
      nfCredencialId = GUID(
          If(
              nfStudioMode,
              "162d450e-9652-f111-bec7-000d3a29c9a8",
              GUID(
                  Substitute(
                      Substitute(
                          Param("recordId"),
                          "{",
                          ""
                      ),
                      "}",
                      ""
                  )
              )
          )
      );
      nfSystemUser = LookUp(
          Usuarios,
          'Id. de objeto de Azure AD' = User().EntraObjectId
      );
    Theme: =PowerAppsTheme
