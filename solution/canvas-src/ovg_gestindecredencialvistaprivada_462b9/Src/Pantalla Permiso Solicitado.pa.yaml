Screens:
  Pantalla Permiso Solicitado:
    Properties:
      Fill: =nfColorGrayClaro
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =Set(
            gblVisibleLoader,
            false
        );
        RequestHide();
    Children:
      - ContPadre_Inicio_2:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =App.Theme.Colors.PrimaryForeground
            Height: =Parent.Height - (Self.Y*2)
            Width: =480
            X: =10
            Y: =10
          Children:
            - LblNoTienePermiso_1:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  AutoHeight: =true
                  Height: '=31  '
                  Size: =22
                  Text: =$"Permiso solicitado a {gblCredencial_SoloLectura.'Usuario propietario'.'Nombre completo'}, aguarde aprobación. Será notificado vía Ms. Teams"
                  Width: =450
                  X: =20
                  Y: =155
